<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trench+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #141414; --muted: #7a7a76; --faint: #a8a8a3;
    --line: #e8e8e4; --soft: #f1f1ee; --accent: #127a4b; --accent-soft: #e6f3ec;
    --bad: #b4412f; --bad-soft: #f8e9e5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0f; --card: #17171a; --ink: #f2f2f0; --muted: #8d8d92; --faint: #5f5f64;
      --line: #26262b; --soft: #1e1e22; --accent: #4cc38a; --accent-soft: #15291f;
      --bad: #ef8a76; --bad-soft: #33201c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 400 clamp(44px, 7vw, 68px)/1 "Instrument Serif", Georgia, serif; letter-spacing: -.01em; margin: 10px 0 0; }
  .sub { color: var(--muted); margin-top: 10px; font-size: 13px; }
  .stats { display: flex; gap: 28px; }
  .record { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; margin: -12px 0 28px; }
  .rec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .rec .lab { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .rec .big { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .rec .big b { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .rec .big span { font-size: 16px; font-weight: 600; color: var(--accent); }
  .rec .big span.below { color: var(--muted); }
  .rec .lw { font-size: 12px; color: var(--faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 28px; }
  .search { flex: 1 1 220px; position: relative; }
  .search input {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; padding: 0 14px 0 36px; outline: none;
  }
  .search input:focus { border-color: var(--muted); }
  .search svg { position: absolute; left: 12px; top: 12px; color: var(--faint); }

  .day { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 14px; }
  .day h2 { font: 400 26px/1 "Instrument Serif", Georgia, serif; margin: 0; }
  .day span { color: var(--faint); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr)); gap: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 14px;
    display: flex; flex-direction: column; gap: 14px; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .top .tv { color: var(--faint); }
  .pill { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 999px;
          background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; }

  .team { display: grid; grid-template-columns: 4px 34px 1fr auto; align-items: center; gap: 12px; }
  .bar { width: 4px; height: 34px; border-radius: 4px; background: var(--tc); }
  .logo { width: 34px; height: 34px; object-fit: contain; }
  .mono { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
          background: var(--tc); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .02em; }
  .tname { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .tname small { display: block; font-weight: 400; font-size: 12px; color: var(--faint); margin-top: 2px; }
  .score { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .score.lose { color: var(--faint); font-weight: 500; }
  .final { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  .lines { display: grid; grid-template-columns: 52px 1fr 1fr; border-top: 1px solid var(--line); padding-top: 12px;
           row-gap: 6px; font-variant-numeric: tabular-nums; }
  .lines .h { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .lines .k { font-size: 12px; color: var(--muted); }
  .lines .v { font-weight: 500; }
  .lines .v.model { font-weight: 600; }
  .lines .na { color: var(--faint); font-weight: 400; }
  .venue { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); margin-bottom: 16px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1 Inter, sans-serif; padding: 9px 18px;
                 border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .controls select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                     font: inherit; padding: 0 12px; flex: 0 1 220px; }

  .rt-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  table.rt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 760px; }
  .rt th { position: sticky; top: 0; background: var(--card); text-align: right; font-size: 11px; font-weight: 600; letter-spacing: .08em;
           text-transform: uppercase; color: var(--muted); padding: 12px 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rt th button { all: unset; cursor: pointer; }
  .rt th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .rt th.on { color: var(--ink); }
  .rt th.l, .rt td.l { text-align: left; }
  .rt td { padding: 9px 12px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .rt tbody tr:first-child td { border-top: 0; }
  .rt tbody tr:hover td { background: var(--soft); }
  .rt .rkn { color: var(--muted); font-weight: 600; width: 44px; }
  .rt .tm { display: flex; align-items: center; gap: 10px; }
  .rt .tm .logo, .rt .tm .mono { width: 26px; height: 26px; font-size: 8px; }
  .rt .tm b { font-weight: 600; }
  .rt .tm small { display: block; color: var(--faint); font-size: 11px; }
  .rt .num { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .rt .num .rk { min-width: 38px; }
  .rt .big { font-weight: 700; }

  .card[data-id] { cursor: pointer; }
  .card[data-id]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .foot-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .more { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .card:hover .more { color: var(--accent); }

  /* matchup breakdown */
  dialog.sheet { width: min(760px, calc(100% - 24px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--line);
                 border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.25); }
  dialog.sheet::backdrop { background: rgba(10,10,12,.45); backdrop-filter: blur(2px); }
  .sh-top { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line);
            padding: 18px 20px 16px; }
  .sh-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0;
              background: var(--soft); color: var(--muted); font: 600 18px/1 Inter, sans-serif; cursor: pointer; }
  .sh-close:hover { color: var(--ink); }
  .sh-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .sh-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 12px; }
  .sh-team { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sh-team.home { flex-direction: row-reverse; text-align: right; }
  .sh-team .logo, .sh-team .mono { width: 40px; height: 40px; flex: none; }
  .sh-team b { display: block; font-size: 16px; line-height: 1.2; }
  .sh-team small { color: var(--faint); font-size: 12px; }
  .sh-score { font: 400 34px/1 "Instrument Serif", Georgia, serif; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sh-lines { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .sh-lines b { color: var(--ink); font-weight: 600; }
  .sh-body { padding: 6px 20px 22px; }
  .sh-sec { margin-top: 18px; }
  .sh-sec h3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin: 0 0 6px; font-size: 11px; font-weight: 600;
               letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .sh-sec h3 span:last-child { text-align: right; }
  .sh-sec h3 span:nth-child(2) { color: var(--ink); letter-spacing: .06em; text-align: center; }
  .row { display: grid; grid-template-columns: 1fr minmax(120px, 1.3fr) 1fr; align-items: center; gap: 8px; padding: 7px 0;
         border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .row .lab { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.25; }
  .cell { display: flex; align-items: center; gap: 8px; }
  .cell.r { justify-content: flex-end; }
  .cell .v { font-weight: 500; }
  .cell.win .v { font-weight: 700; }
  .rk { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); min-width: 40px; text-align: center; }
  .rk.top { background: var(--accent-soft); color: var(--accent); }
  .rk.low { background: var(--bad-soft); color: var(--bad); }
  .cell.win::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .cell.r.win::before { order: 2; }
  .sh-note { margin-top: 18px; font-size: 11px; line-height: 1.55; color: var(--faint); }
  @media (max-width: 520px) {
    .sh-top { padding: 14px 14px 12px; }
    .sh-body { padding: 4px 14px 18px; }
    .sh-teams { gap: 6px; margin-top: 8px; }
    .sh-team, .sh-team.home { flex-direction: column; text-align: center; gap: 4px; }
    .sh-team .logo, .sh-team .mono { width: 28px; height: 28px; }
    .sh-team b { font-size: 13px; }
    .sh-score { font-size: 24px; }
    .sh-lines { margin-top: 8px; }
    .row { grid-template-columns: 1fr minmax(96px, 1.2fr) 1fr; }
    .rk { min-width: 34px; padding: 2px 5px; }
  }

  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; line-height: 1.6; }
</style>
</head>

<div class="wrap">

</div>

  for (const g of games) {

      <td class="l"><div class="tm" style="--tc:${esc(d.color)}">${logo(d)}<div><b>${esc(n)}</b><small>${esc(d.conf || "")}</small></div></div></td>
      <td>${esc(d.record || "0–0")}</td>
      ${RCOLS.map(([k, , get, f]) => { const v = get(t); return `<td>${v ? `<span class="num"><span class="${k === "overall" ? "big" : ""}">${FMT[f](v[0])}</span>${k === "pace" ? `<span class="rk">#${v[1]}</span>` : rankPill(v[1])}</span>` : "—"}</td>`; }).join("")}
    </tr>`;
  }).join("");
  $("#ratings").innerHTML = names.length ? `<div class="rt-wrap"><table class="rt">
      <thead><tr>${th("overall", "Rk", "l")}${th("team", "Team", "l")}${th("record", "Record")}${RCOLS.map(([k, h]) => th(k, h)).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="sh-note">Week ${DATA.meta.week} ratings entering the week, ${B.n} FBS teams. Overall = projected margin vs. an average FBS team on a neutral field;
      offense / defense = points scored / allowed vs. an average opponent. Stats are opponent-adjusted and still blend in ${Math.round(B.priorWeight * 100)}% of the preseason rating.
      Click a column to sort.</p>` : `<div class="empty">No teams match.</div>`;
}
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#board").hidden = tab !== "games"; $("#ratings").hidden = tab !== "ratings"; $("#conf").hidden = tab !== "ratings";
  $("#q").placeholder = tab === "ratings" ? "Search teams or conferences" : "Search teams";
  try {   // keep #ratings in the URL so the tab can be linked; harmless if the page can't change its URL
    if (location.hash !== "#" + tab) history.replaceState(null, "", tab === "games" ? location.pathname + location.search : "#ratings");
  } catch (e) {}
  tab === "ratings" ? renderRatings() : render();
}
(function initRatings() {
  const confs = [...new Set(Object.values(DATA.teams || {}).map(t => t.conf).filter(Boolean))].sort();
  $("#conf").innerHTML = `<option value="">All conferences</option>` + confs.map(c => `<option>${esc(c)}</option>`).join("");
  $("#conf").addEventListener("change", e => { state.conf = e.target.value; renderRatings(); });
  document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
  $("#ratings").addEventListener("click", e => {
    const b = e.target.closest("button[data-sort]"); if (!b) return;
    const k = b.dataset.sort;
    if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = 1; }
    renderRatings();
  });
})();
$("#q").addEventListener("input", e => { state.q = e.target.value; state.tab === "ratings" ? renderRatings() : render(); });
dark.addEventListener("change", () => state.tab === "ratings" ? renderRatings() : render());
header(); recordCards(); setTab(location.hash === "#ratings" ? "ratings" : "games");
</script>
</body>
</html>
