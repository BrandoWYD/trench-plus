<style>
  :root {

      --line: #26262b; --soft: #1e1e22; --accent: #4cc38a; --accent-soft: #15291f;
      color-scheme: dark;

  * { box-sizing: border-box; }

  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .sub { color: var(--muted); margin-top: 10px; font-size: 13px; }

  .rec .big span { font-size: 16px; font-weight: 600; color: var(--accent); }
  .rec .big span.below { color: var(--muted); }
  .rec .lw { font-size: 12px; color: var(--faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 28px; }
  .search { flex: 1 1 220px; position: relative; }
  .search input {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; padding: 0 14px 0 36px; outline: none;
  }
  .search input:focus { border-color: var(--muted); }
  .search svg { position: absolute; left: 12px; top: 12px; color: var(--faint); }

  .day { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 14px; }
  .day h2 { font: 400 26px/1 "Instrument Serif", Georgia, serif; margin: 0; }
  .day span { color: var(--faint); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr)); gap: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 14px;
    display: flex; flex-direction: column; gap: 14px; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .top .tv { color: var(--faint); }
  .pill { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 999px;
          background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; }

  .team { display: grid; grid-template-columns: 4px 34px 1fr auto; align-items: center; gap: 12px; }
  .bar { width: 4px; height: 34px; border-radius: 4px; background: var(--tc); }
  .logo { width: 34px; height: 34px; object-fit: contain; }
  .mono { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
          background: var(--tc); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .02em; }
  .tname { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .tname small { display: block; font-weight: 400; font-size: 12px; color: var(--faint); margin-top: 2px; }
  .score { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .score.lose { color: var(--faint); font-weight: 500; }
  .final { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  .lines { display: grid; grid-template-columns: 52px 1fr 1fr; border-top: 1px solid var(--line); padding-top: 12px;
           row-gap: 6px; font-variant-numeric: tabular-nums; }
  .lines .h { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .lines .k { font-size: 12px; color: var(--muted); }
  .lines .v { font-weight: 500; }
  .lines .v.model { font-weight: 600; }
  .lines .na { color: var(--faint); font-weight: 400; }
  .venue { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; line-height: 1.6; }
</style>
</head>

const state = { q: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (x, d = 1) => (Math.round(x * 2) / 2).toFixed(d === 1 ? 1 : 0);
const dark = matchMedia("(prefers-color-scheme: dark)");

function spreadLabel(g, homeMargin) {
  if (homeMargin == null) return null;
  const v = Math.round(Math.abs(homeMargin) * 10) / 10;   // exact to one decimal
  if (v === 0) return "PK";
  return `${homeMargin > 0 ? g.home.abbr : g.away.abbr} −${v.toFixed(1)}`;
}
function logo(t) {
  const src = dark.matches && t.logoDark ? t.logoDark : t.logo;
  if (!src) return `<div class="mono">${esc(t.abbr)}</div>`;
  return `<img class="logo" src="${src}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;mono&quot;>${esc(t.abbr)}</div>'">`;
}
function teamRow(g, side) {
  const t = g[side], score = side === "home" ? g.model.homeScore : g.model.awayScore;
  const other = side === "home" ? g.model.awayScore : g.model.homeScore;
  const fin = g.final ? `<div class="final">Final ${g.final[side]}</div>` : "";
  return `<div class="team" style="--tc:${esc(t.color)}">
      <div class="bar"></div>${logo(t)}
      <div class="tname">${esc(t.name)}<small>${esc(t.record)}${side === "home" && g.neutral ? " · neutral" : ""}</small></div>
      <div><div class="score ${score < other ? "lose" : ""}">${score.toFixed(1)}</div>${fin}</div>
    </div>`;
}
function kick(g) {
  if (!g.kickoff) return "TBD";
  const d = new Date(g.kickoff);
  const day = d.toLocaleDateString([], { weekday: "short" });
  return g.tbd ? `${day} · TBD` : `${day} · ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
}
function card(g) {
  const pill = g.final ? `<span class="pill">Final</span>` : (g.book.homeMargin == null ? `<span class="pill">No line yet</span>` : "");
  const bookS = spreadLabel(g, g.book.homeMargin), bookT = g.book.total;
  return `<article class="card">
    <div class="top"><span>${kick(g)}${g.tv ? ` <span class="tv">· ${esc(g.tv)}</span>` : ""}</span>${pill}</div>
    ${teamRow(g, "away")}
    ${teamRow(g, "home")}
    <div class="lines">
      <span></span><span class="h">Spread</span><span class="h">Total</span>
      <span class="k">Model</span><span class="v model">${spreadLabel(g, g.model.homeMargin)}</span><span class="v model">${g.model.total.toFixed(1)}</span>
      <span class="k">Book</span><span class="v ${bookS ? "" : "na"}">${bookS ?? "—"}</span><span class="v ${bookT != null ? "" : "na"}">${bookT != null ? bookT.toFixed(1) : "—"}</span>
    </div>
    <div class="venue">${esc(g.venue)}${g.fcs ? " · FCS opponent" : ""}</div>
  </article>`;
}
function render() {
  const q = state.q.trim().toLowerCase();
  let games = DATA.games.filter(g => !q || [g.home.name, g.away.name, g.home.abbr, g.away.abbr].some(s => s.toLowerCase().includes(q)));
  const board = $("#board");
  if (!games.length) { board.innerHTML = `<div class="empty">No games match.</div>`; return; }
  const days = new Map();
  for (const g of games) {
    const k = g.kickoff ? new Date(g.kickoff).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }) : "Time TBD";
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(g);
  }
  board.innerHTML = [...days].map(([k, gs]) =>
    `<div class="day"><h2>${esc(k)}</h2><span>${gs.length} game${gs.length > 1 ? "s" : ""}</span></div><div class="grid">${gs.map(card).join("")}</div>`).join("");
}
function header() {
  const m = DATA.meta, gs = DATA.games;
  const withLine = gs.filter(g => g.book.homeMargin != null).length;
  $("#eyebrow").textContent = `${m.year} · ${m.seasonType === "postseason" ? "Bowls" : "Week " + m.week}`;
  $("#sub").textContent = `Model projections vs. the book · updated ${m.updated}`;
  $("#stats").innerHTML = [[gs.length, "Games"], [withLine, "With book lines"]]
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  $("#foot").innerHTML = `Projected scores, spreads and totals are from our model. Book spreads and totals: ${esc(m.book)} via CollegeFootballData, as of the update time.
    ${m.record && m.record.season ? `Record: ${m.year} FBS-vs-FBS games; ATS vs. the ${esc(m.book)} line, pushes shown third.${m.record.backfillWeeks.length ? ` Weeks ${m.record.backfillWeeks.join(", ")} are point-in-time backfills (only data available before each week).` : ""}` : ""}
    For information only — not betting advice.`;
}
function recordCards() {
  const r = DATA.meta.record;
  if (!r || !r.season) return;
  const pct = x => x.pct == null ? "—" : (x.pct * 100).toFixed(1) + "%";
  const wl = x => `${x.w}–${x.l}${x.p ? "–" + x.p : ""}`;
  const lw = r.lastPost ? `Bowl week ${r.lastWeek}` : `Week ${r.lastWeek}`;
  const box = (label, key, even) => {
    const s = r.season[key], l = r.last[key];
    return `<div class="rec"><div class="lab">${label}</div>
      <div class="big"><b>${wl(s)}</b><span class="${s.pct != null && s.pct < even ? "below" : ""}">${pct(s)}</span></div>
      <div class="lw">${lw}: ${wl(l)} · ${pct(l)}</div></div>`;
  };
  const el = $("#record");
  el.innerHTML = box("Straight up", "su", 0.5) + box("Against the spread", "ats", 0.5238);
  el.hidden = false;
}
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
dark.addEventListener("change", render);
header(); recordCards(); render();
</script>
